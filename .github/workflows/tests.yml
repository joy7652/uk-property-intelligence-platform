# Runner versions track DBR 17.3 LTS: Ubuntu 24.04, Zulu Java 17, Python 3.12.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Always runs, so a required check always reports even on a documentation change.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Reads the pin from requirements-dev.txt without installing PySpark, which
      # linting does not need.
      - name: Install ruff
        run: pip install "$(grep -m1 '^ruff==' requirements-dev.txt)"

      # Rules and the Databricks runtime builtins are declared in ruff.toml, so this
      # runs what a local `ruff check` runs.
      - name: Lint
        run: ruff check .

  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether the suites need to run
        id: filter
        shell: bash
        run: |
          # Skipping the suites wrongly produces a green check over untested code, so
          # every path that cannot establish a diff runs them.
          changed=""
          case "${{ github.event_name }}" in
            pull_request)
              changed=$(git diff --name-only \
                "origin/${{ github.base_ref }}...HEAD") ;;
            push)
              before="${{ github.event.before }}"
              if [ -n "$before" ] \
                 && [ "$before" != "0000000000000000000000000000000000000000" ]; then
                changed=$(git diff --name-only "$before" "${{ github.sha }}")
              fi ;;
          esac

          if [ -z "$changed" ]; then
            echo "No diff available, running the suites."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed:"
          echo "$changed" | sed 's/^/  /'

          if echo "$changed" \
             | grep -qvE '(\.md$)|(^docs/)|(^LICENSE$)|(^\.gitignore$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.list.outputs.suites }}
    steps:
      - uses: actions/checkout@v6

      - name: List suite directories
        id: list
        shell: bash
        run: |
          # A directory with no tests exits pytest with 5, so only directories
          # holding at least one test file become matrix legs. A new suite joins
          # the matrix as soon as it has a test, with no edit here.
          suites=""
          for directory in tests/*/; do
            name=$(basename "$directory")
            if [ -n "$(find "$directory" -name 'test_*.py' -print -quit)" ]; then
              suites="${suites:+$suites,}\"$name\""
            fi
          done
          if [ -z "$suites" ]; then
            echo "::error::No suite directories found under tests/"
            exit 1
          fi
          # A test file at the root of tests/ would belong to no leg, and a run that
          # never collected it would still report green.
          if compgen -G "tests/test_*.py" > /dev/null; then
            echo "::error::Test files directly under tests/ are not covered by any leg"
            exit 1
          fi
          echo "suites=[$suites]" >> "$GITHUB_OUTPUT"
          echo "matrix: [$suites]"

  tests:
    needs: [changes, discover]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.discover.outputs.suites) }}
    env:
      # Pins the driver to loopback so session start does not depend on hostname
      # resolution.
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # pipefail is explicit, so the behaviour does not depend on how the runner
      # resolves its shell. Without it the pipe returns tee's exit code and a failing
      # suite reports success.
      - name: Run ${{ matrix.suite }}
        shell: bash
        run: |
          set -o pipefail
          pytest "tests/${{ matrix.suite }}" -q --tb=line | tee pytest.log

      # One shared cause can fail hundreds of tests. This collapses the leg to the
      # distinct errors raised, ordered by how many tests each one accounts for.
      - name: Distinct failure signatures
        if: failure()
        shell: bash
        run: |
          grep -E '^/.+\.py:[0-9]+: ' pytest.log \
            | sed -E 's|^.*\.py:[0-9]+: ||' \
            | sort | uniq -c | sort -rn | head -40

  # One stable check name to require in branch protection. Matrix leg names change
  # whenever a suite directory is added or renamed; this one does not.
  tests-passed:
    needs: [changes, tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify the suites passed or were legitimately skipped
        shell: bash
        run: |
          result="${{ needs.tests.result }}"
          echo "suites: $result"
          case "$result" in
            success)
              ;;
            skipped)
              # Only a documentation-only change may skip. A skip from an upstream
              # failure reaches here with code still true and fails.
              if [ "${{ needs.changes.outputs.code }}" != "false" ]; then
                echo "::error::Suites were skipped without a documentation-only diff"
                exit 1
              fi
              echo "Documentation only, suites not required." ;;
            *)
              exit 1 ;;
          esac
