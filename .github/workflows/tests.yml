# Runner versions track DBR 17.3 LTS: Ubuntu 24.04, Zulu Java 17, Python 3.12.
#
# Actions are pinned to full commit SHAs, with the release each one resolved to beside
# it. A tag can be moved to different code after it was reviewed and a commit cannot,
# which matters here because dbt-build can mint a token that reaches the workspace.
# .github/dependabot.yml proposes new pins as pull requests.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Always runs, so a required check always reports even on a documentation change.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Reads the pin from requirements-dev.txt without installing PySpark, which
      # linting does not need.
      - name: Install ruff
        run: pip install "$(grep -m1 '^ruff==' requirements-dev.txt)"

      # Rules and the Databricks runtime builtins are declared in ruff.toml, so this
      # runs what a local `ruff check` runs.
      - name: Lint
        run: ruff check .

  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether the suites need to run
        id: filter
        shell: bash
        run: |
          # Skipping the suites wrongly produces a green check over untested code, so
          # every path that cannot establish a diff runs them.
          changed=""
          case "${{ github.event_name }}" in
            pull_request)
              changed=$(git diff --name-only \
                "origin/${{ github.base_ref }}...HEAD") ;;
            push)
              before="${{ github.event.before }}"
              if [ -n "$before" ] \
                 && [ "$before" != "0000000000000000000000000000000000000000" ]; then
                changed=$(git diff --name-only "$before" "${{ github.sha }}")
              fi ;;
          esac

          if [ -z "$changed" ]; then
            echo "No diff available, running the suites."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed:"
          echo "$changed" | sed 's/^/  /'

          if echo "$changed" \
             | grep -qvE '(\.md$)|(^docs/)|(^LICENSE$)|(^\.gitignore$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.list.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List suite directories
        id: list
        shell: bash
        run: |
          # A directory with no tests exits pytest with 5, so only directories
          # holding at least one test file become matrix legs. A new suite joins
          # the matrix as soon as it has a test, with no edit here.
          suites=""
          for directory in tests/*/; do
            name=$(basename "$directory")
            if [ -n "$(find "$directory" -name 'test_*.py' -print -quit)" ]; then
              suites="${suites:+$suites,}\"$name\""
            fi
          done
          if [ -z "$suites" ]; then
            echo "::error::No suite directories found under tests/"
            exit 1
          fi
          # A test file at the root of tests/ would belong to no leg, and a run that
          # never collected it would still report green.
          if compgen -G "tests/test_*.py" > /dev/null; then
            echo "::error::Test files directly under tests/ are not covered by any leg"
            exit 1
          fi
          echo "suites=[$suites]" >> "$GITHUB_OUTPUT"
          echo "matrix: [$suites]"

  tests:
    needs: [changes, discover]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.discover.outputs.suites) }}
    env:
      # Pins the driver to loopback so session start does not depend on hostname
      # resolution.
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: "17"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # pipefail is explicit, so the behaviour does not depend on how the runner
      # resolves its shell. Without it the pipe returns tee's exit code and a failing
      # suite reports success.
      - name: Run ${{ matrix.suite }}
        shell: bash
        run: |
          set -o pipefail
          pytest "tests/${{ matrix.suite }}" -q --tb=line | tee pytest.log

      # One shared cause can fail hundreds of tests. This collapses the leg to the
      # distinct errors raised, ordered by how many tests each one accounts for.
      - name: Distinct failure signatures
        if: failure()
        shell: bash
        run: |
          grep -E '^/.+\.py:[0-9]+: ' pytest.log \
            | sed -E 's|^.*\.py:[0-9]+: ||' \
            | sort | uniq -c | sort -rn | head -40

  # The dbt project compiled with no warehouse and no credential: every ref, source,
  # macro, test and contract has to resolve. The docs site is generated from what parsed
  # and kept as an artifact.
  dbt-parse:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dbt
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/ci
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      # Nothing here connects. The adapter refuses a profile with these unset, and
      # .invalid is a reserved name that resolves nowhere.
      DATABRICKS_HOST: offline.invalid
      DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/offline
      DATABRICKS_CLIENT_ID: offline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      # The pins the monthly job's marts_build task installs.
      - name: Install dbt
        run: pip install -r requirements.txt

      - name: Install packages
        run: dbt deps

      # Warnings fail here. A parse warning is a config that applies to nothing or a
      # deprecation, and neither is worth merging. The build below keeps dbt's own
      # severities, so a test declared as a warning still warns.
      - name: Parse
        run: dbt parse --warn-error

      # One self-contained page, no warehouse catalog behind it, so it describes the
      # project as declared rather than the relations as built.
      - name: Generate the docs site
        run: dbt docs generate --no-compile --empty-catalog --static

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbt-docs
          path: dbt/target/static_index.html
          if-no-files-found: error
          retention-days: 30

  # The marts built and tested on the warehouse, into marts_ci, as the dbt-ci service
  # principal. No secret is stored anywhere: GitHub signs a token naming this repository
  # and the databricks-ci environment, and Databricks exchanges it for a short-lived one
  # under the federation policy on that principal.
  dbt-build:
    needs: [changes, dbt-parse]
    # A pull request from a fork runs code nobody here has reviewed, and GitHub gives it
    # no token to exchange. A Dependabot pull request changes action pins and nothing
    # else, and those pins are the code nobody has reviewed yet, so the one job holding a
    # token waits for them to merge and runs them on the push to main.
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event_name != 'pull_request'
          || (github.event.pull_request.head.repo.full_name == github.repository
              && github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: databricks-ci
    # The one job allowed to request a token.
    permissions:
      contents: read
      id-token: write
    # One schema serves every branch, so builds from different branches queue instead of
    # replacing each other's views part-way through a test.
    concurrency:
      group: dbt-marts-ci
      cancel-in-progress: false
    defaults:
      run:
        working-directory: dbt
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/ci
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ vars.DATABRICKS_HTTP_PATH }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      - name: Install dbt
        run: pip install -r requirements.txt

      - name: Install packages
        run: dbt deps

      # The token is requested, exchanged and spent inside this one step, so no later
      # step, no file and no other process on the runner ever holds it.
      #
      # The audience is the Databricks account id, which is what Databricks recommends
      # the federation policy expects, so the token names the one service it is for.
      - name: Build and test the marts
        shell: bash
        env:
          AUDIENCE: ${{ vars.DATABRICKS_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          missing=""
          for name in DATABRICKS_HOST DATABRICKS_HTTP_PATH DATABRICKS_CLIENT_ID AUDIENCE; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not set in the databricks-ci environment:$missing"
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No token endpoint. The job needs id-token: write."
            exit 1
          fi

          response=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")
          token=$(python -c 'import json, sys; print(json.load(sys.stdin)["value"])' \
            <<< "$response")
          echo "::add-mask::$token"

          # The claim the federation policy matches exactly, printed so a mismatch can
          # be read off the log. Passed through the environment rather than an argument,
          # which any process on the runner could list.
          TOKEN="$token" python - <<'PY'
          import base64, json, os
          payload = os.environ["TOKEN"].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          print(f"subject {claims['sub']}")
          PY

          DATABRICKS_OIDC_TOKEN="$token" dbt build

      - name: Keep the run results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbt-build-results
          path: |
            dbt/target/run_results.json
            dbt/logs/dbt.log
          if-no-files-found: ignore
          retention-days: 30

  # One stable check name to require in branch protection. Matrix leg names change
  # whenever a suite directory is added or renamed; this one does not.
  tests-passed:
    needs: [changes, tests, dbt-parse, dbt-build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify every check passed or was legitimately skipped
        shell: bash
        env:
          CODE: ${{ needs.changes.outputs.code }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          DEPENDABOT: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
          SUITES: ${{ needs.tests.result }}
          DBT_PARSE: ${{ needs.dbt-parse.result }}
          DBT_BUILD: ${{ needs.dbt-build.result }}
        run: |
          # A check may skip only for a documentation-only diff, and the warehouse build
          # also for a pull request from a fork or from Dependabot. A skip caused by an
          # upstream failure reaches here with none of those true and fails.
          docs_only=false
          [ "$CODE" = "false" ] && docs_only=true
          build_may_skip=$docs_only
          [ "$FORK" = "true" ] && build_may_skip=true
          [ "$DEPENDABOT" = "true" ] && build_may_skip=true

          failed=0
          check() {
            echo "$1: $2"
            case "$2" in
              success) ;;
              skipped)
                if [ "$3" != "true" ]; then
                  echo "::error::$1 was skipped, and nothing about this run allows it to be"
                  failed=1
                fi ;;
              *) failed=1 ;;
            esac
          }

          check suites "$SUITES" "$docs_only"
          check dbt-parse "$DBT_PARSE" "$docs_only"
          check dbt-build "$DBT_BUILD" "$build_may_skip"

          if [ "$docs_only" = "true" ]; then
            echo "Documentation only, suites not required."
          fi
          exit $failed
